<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxYxsUUTmwHEo0KFHJdRXsVeD7unwC8CP4M7AWKknDJf_lmF1PwV_hCmALUA0wl7IVC/exec";

    let rawJobData = [];

    window.onload = function() {
      // เซ็ตค่าวันที่เริ่มต้นในฟอร์มแบบตัดข้อความธรรมดา (ไม่ใช้ new Date ที่พ่วงไทม์โซน)
      let todayStr = new Date().toLocaleDateString('en-CA'); // ได้รูปแบบ YYYY-MM-DD ตามเวลาเครื่องเป๊ะ
      document.getElementById('recordDate').value = todayStr;
      
      loadData();
      loadOilPrices();
    };

    function openModal() {
      document.getElementById('jobModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('jobModal').classList.add('hidden');
    }

    function loadOilPrices() {
      fetch(`${API_URL}?action=getOilPrices`)
        .then(response => response.json())
        .then(res => {
          document.getElementById('oilUpdateTime').innerText = `อัพเดตล่าสุด ${res.updateTime}`;
          let html = '';
          res.prices.forEach(item => {
            let badgeColor = 'bg-slate-100 text-slate-700';
            if (item.status === 'เพิ่มขึ้น') badgeColor = 'bg-rose-50 text-rose-700 border border-rose-100';
            else if (item.status === 'ลดลง') badgeColor = 'bg-emerald-50 text-emerald-700 border border-emerald-100';
            else badgeColor = 'bg-amber-50 text-amber-700 border border-amber-100';

            html += `
              <div class="p-3 bg-slate-50/70 rounded-xl border border-slate-100 flex flex-col gap-1">
                <div class="text-xs font-bold text-slate-800">${item.fuelType}</div>
                <div class="flex justify-between items-center">
                  <span class="text-sm font-extrabold text-blue-900">${item.price.toFixed(2)} <span class="text-[10px] font-normal text-slate-500">บาท/ลิตร</span></span>
                  <span class="text-[11px] font-semibold px-2 py-0.5 rounded-md ${badgeColor}">${item.status}</span>
                </div>
              </div>
            `;
          });
          document.getElementById('oilPriceList').innerHTML = html;
        })
        .catch(err => console.error('Error loading oil prices:', err));
    }

    function loadData() {
      fetch(`${API_URL}?action=getJobRates`)
        .then(response => response.json())
        .then(data => {
          rawJobData = data || [];
          populateClientDropdown(rawJobData);
          applyFilters();
        })
        .catch(err => {
          console.error('Error loading job rates:', err);
          document.getElementById('jobTableBody').innerHTML = `<tr><td colspan="9" class="p-8 text-center text-rose-500">ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบ URL API</td></tr>`;
        });
    }

    function populateClientDropdown(data) {
      let clientSelect = document.getElementById('filterClient');
      let currentVal = clientSelect.value;
      let clients = [...new Set(data.map(item => item.clientName).filter(Boolean))];
      let html = '<option value="">-- ผู้ว่าจ้างทั้งหมด --</option>';
      clients.forEach(client => { html += `<option value="${client}">${client}</option>`; });
      clientSelect.innerHTML = html;
      clientSelect.value = currentVal;
    }

    function applyFilters() {
      let searchText = document.getElementById('searchInput').value.toLowerCase().trim();
      let selectedClient = document.getElementById('filterClient').value;
      let selectedOilRange = document.getElementById('filterOilRange').value;

      let filteredData = rawJobData.filter(item => {
        let matchSearch = !searchText || 
          (item.clientName && String(item.clientName).toLowerCase().includes(searchText)) ||
          (item.material && String(item.material).toLowerCase().includes(searchText)) ||
          (item.deliveryPoint && String(item.deliveryPoint).toLowerCase().includes(searchText)) ||
          (item.recorder && String(item.recorder).toLowerCase().includes(searchText));

        let matchClient = !selectedClient || item.clientName === selectedClient;
        let matchOilRange = !selectedOilRange || item.oilPriceRange === selectedOilRange;

        return matchSearch && matchClient && matchOilRange;
      });

      renderTable(filteredData);
    }

    function renderTable(data) {
      let tbody = document.getElementById('jobTableBody');
      document.getElementById('totalCount').innerText = `${data.length} รายการ`;

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="p-8 text-center text-slate-400">ไม่พบรายการที่ตรงกับการค้นหา</td></tr>`;
        return;
      }

      let html = '';
      data.forEach(row => {
        let priceNum = parseFloat(row.jobPrice) || 0;
        
        // แสดงผลข้อความวันที่ตรงๆ จากหลังบ้านแบบ 100% ตัวอักษรต่อตัวอักษร ไม่มีการคำนวณใดๆ ทั้งสิ้น
        let displayDate = row.recordDate || '';

        html += `
          <tr class="hover:bg-slate-50 transition duration-150">
            <td class="py-3.5 px-4 pl-6 font-medium text-slate-600 text-xs">${displayDate}</td>
            <td class="py-3.5 px-4 font-semibold text-slate-900">${row.clientName || ''}</td>
            <td class="py-3.5 px-4 text-slate-700">${row.material || ''}</td>
            <td class="py-3.5 px-4 text-slate-700">${row.deliveryPoint || ''}</td>
            <td class="py-3.5 px-4 text-slate-600 text-xs"><span class="bg-slate-100 text-slate-800 px-2.5 py-1 rounded-md font-medium">${row.oilPriceRange || ''}</span></td>
            <td class="py-3.5 px-4 text-right font-bold text-blue-900">${priceNum.toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
            <td class="py-3.5 px-4 text-center text-slate-500 text-xs">${row.unit || ''}</td>
            <td class="py-3.5 px-4 text-slate-600 text-xs">${row.recorder || ''}</td>
            <td class="py-3.5 px-4 text-center pr-6">
              ${row.mapLink ? `<a href="${row.mapLink}" target="_blank" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white transition shadow-sm" title="เปิดแผนที่"><i class="fa-solid fa-map-location-dot"></i></a>` : '-'}
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      let btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `กำลังบันทึก...`;

      // แปลงค่า YYYY-MM-DD เป็น DD/MM/YYYY ด้วยการตัด String ธรรมดา (ไม่ใช้ Date object)
      let rawDateVal = document.getElementById('recordDate').value; 
      let formattedDate = rawDateVal;
      if (rawDateVal && rawDateVal.includes('-')) {
        let p = rawDateVal.split('-');
        if (p.length === 3) {
          formattedDate = `${p[2]}/${p[1]}/${p[0]}`; // ได้ "DD/MM/YYYY" ตรงเป๊ะ
        }
      }

      let formData = {
        recordDate: formattedDate,
        clientName: document.getElementById('clientName').value,
        material: document.getElementById('material').value,
        deliveryPoint: document.getElementById('deliveryPoint').value,
        oilPriceRange: document.getElementById('oilPriceRange').value,
        jobPrice: document.getElementById('jobPrice').value,
        unit: document.getElementById('unit').value,
        recorder: document.getElementById('recorder').value,
        mapLink: document.getElementById('mapLink').value
      };

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(formData)
      })
      .then(response => response.json())
      .then(res => {
        if(res.success) {
          closeModal();
          document.getElementById('jobForm').reset();
          document.getElementById('recordDate').value = new Date().toLocaleDateString('en-CA');
          loadData();
        } else {
          alert('เกิดข้อผิดพลาด: ' + res.message);
        }
        btn.disabled = false;
        btn.innerHTML = `บันทึกข้อมูล`;
      })
      .catch(err => {
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err);
        btn.disabled = false;
        btn.innerHTML = `บันทึกข้อมูล`;
      });
    }
  </script>
